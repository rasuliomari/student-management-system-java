<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Student Management
    </div>

</header>

<main class="form-container">

    <h1>Login</h1>

    <div th:if="${error}"
         style="color: red; margin-bottom: 15px;">

        <p th:text="${error}"></p>

    </div>

    <form action="/login"
          method="POST">

        <label>
            Username
        </label>

        <input type="text"
               name="username"
               required>


        <label>
            Password
        </label>

        <input type="password"
               name="password"
               required>


        <button type="submit">
            Login
        </button>

    </form>

</main>

<footer>

    <p>
        &copy; 2026 Student Management System
    </p>

</footer>

</body>

</html>
